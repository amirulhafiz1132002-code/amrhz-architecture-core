name: Governance validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-governance:
    name: Validate schemas and records
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install "jsonschema>=4.23,<5"
      - name: Compile validator
        run: python -m py_compile verification/validate.py
      - name: Validate governance
        run: python verification/validate.py
